    <text x="15" y="44" fill="#ddd6fe" font-size="10">Real-time Account Features:</text>
    <text x="15" y="62" fill="#ede9fe" font-size="9">• Days Past Due (DPD) Acceleration</text>
    <text x="15" y="78" fill="#ede9fe" font-size="9">• Broken Promise Propensity Score</text>
    <text x="15" y="94" fill="#ede9fe" font-size="9">• Digital Channel Responsiveness</text>
    <text x="15" y="110" fill="#ede9fe" font-size="9">• Bureau Payment Behavioral Index</text>
    <text x="15" y="134" fill="#a78bfa" font-size="10" font-weight="700">Powered by ₹10 Cr ML Investment</text>
  </g>

  <!-- Executive Dashboard Output -->
  <g transform="translate(905, 490)">
    <rect width="240" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="15" y="24" fill="#34d399" font-size="13" font-weight="700">Executive CEO Cockpit</text>
    <text x="15" y="44" fill="#a7f3d0" font-size="10">60-Second Strategic Visibility:</text>
    <text x="15" y="62" fill="#d1fae5" font-size="9">✓ Calendar-Normalized Run Rates</text>
    <text x="15" y="78" fill="#d1fae5" font-size="9">✓ True Operational Attribution (7d)</text>
    <text x="15" y="94" fill="#d1fae5" font-size="9">✓ Telephony Gateway Route Health</text>
  </g>

  <!-- Algorithmic Dialer Feedback Loop -->
  <g transform="translate(905, 615)">
    <rect width="240" height="120" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="15" y="24" fill="#fbbf24" font-size="13" font-weight="700">Automated Dialer Router</text>
    <text x="15" y="44" fill="#fef3c7" font-size="10">Operational Closed-Loop Action:</text>
    <text x="15" y="62" fill="#fde68a" font-size="9">• Suppress 80% self-cures from calling</text>
    <text x="15" y="78" fill="#fde68a" font-size="9">• Focus capacity on 30-90 DPD Uplift</text>
    <text x="15" y="94" fill="#fde68a" font-size="9">• Route to WhatsApp first (low-cost)</text>
    <text x="15" y="110" fill="#f59e0b" font-size="9" font-weight="700">Unlocks ₹21 Cr – ₹31 Cr Gain</text>
  </g>

  <!-- Feedback Arrow back to Sources -->
  <path d="M 1025 735 L 1025 780 L 140 780 L 140 725" stroke="#f59e0b" stroke-dasharray="6,4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="773" fill="#f59e0b" font-size="11" font-weight="600">Continuous Operational Feedback Loop (Dynamic Campaign Prioritization)</text>
</svg>
