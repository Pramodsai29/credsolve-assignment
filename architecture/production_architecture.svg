  <text x="60" y="65" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="0.5">CredSolve Enterprise Production Analytics Platform</text>
  <text x="60" y="85" fill="#e0e7ff" font-size="13" font-weight="500">End-to-End Enterprise Architecture: Ingestion → Medallion Warehouse → Semantic Layer → Executive Action</text>

