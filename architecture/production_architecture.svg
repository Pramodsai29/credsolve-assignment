  <rect x="40" y="130" width="200" height="630" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="130" width="200" height="42" rx="12" fill="#334155"/>
  <text x="55" y="157" fill="#f8fafc" font-size="14" font-weight="700">1. Data Sources</text>

  <g transform="translate(55, 195)">
    <rect width="170" height="90" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="12" y="24" fill="#38bdf8" font-size="13" font-weight="700">Telephony &amp; Dialer</text>
    <text x="12" y="44" fill="#94a3b8" font-size="11">Airtel, Exotel, Twilio</text>
    <text x="12" y="60" fill="#94a3b8" font-size="11">Calls &amp; Dispositions</text>
    <text x="12" y="76" fill="#fbbf24" font-size="10">CDC &amp; Webhooks</text>
  </g>

  <g transform="translate(55, 305)">
    <rect width="170" height="90" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="12" y="24" fill="#38bdf8" font-size="13" font-weight="700">Payment Gateways</text>
    <text x="12" y="44" fill="#94a3b8" font-size="11">Bank NACH, Razorpay</text>
    <text x="12" y="60" fill="#94a3b8" font-size="11">Cashfree, Core Ledger</text>
    <text x="12" y="76" fill="#fbbf24" font-size="10">Settlement Feeds</text>
  </g>

  <g transform="translate(55, 415)">
    <rect width="170" height="90" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="12" y="24" fill="#38bdf8" font-size="13" font-weight="700">Digital Engagement</text>
    <text x="12" y="44" fill="#94a3b8" font-size="11">WhatsApp Business API</text>
    <text x="12" y="60" fill="#94a3b8" font-size="11">SMS Gateway &amp; Shortlinks</text>
    <text x="12" y="76" fill="#fbbf24" font-size="10">Delivery Callbacks</text>
  </g>

  <g transform="translate(55, 525)">
    <rect width="170" height="90" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="12" y="24" fill="#38bdf8" font-size="13" font-weight="700">CRM &amp; Core LMS</text>
    <text x="12" y="44" fill="#94a3b8" font-size="11">Loan Accounts Master</text>
    <text x="12" y="60" fill="#94a3b8" font-size="11">Borrowers &amp; PTP Records</text>
    <text x="12" y="76" fill="#fbbf24" font-size="10">Daily Snapshots</text>
  </g>

  <g transform="translate(55, 635)">
