    <text x="12" y="24" fill="#38bdf8" font-size="13" font-weight="700">Field Operations</text>
    <text x="12" y="44" fill="#94a3b8" font-size="11">Field Officer App</text>
    <text x="12" y="60" fill="#94a3b8" font-size="11">Geotagged Visits</text>
    <text x="12" y="76" fill="#fbbf24" font-size="10">Receipt Receipts</text>
  </g>

  <!-- Connectors from Sources to Streaming -->
  <path d="M 240 240 L 280 240" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 240 350 L 280 350" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 240 460 L 280 460" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 240 570 L 280 570" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 240 680 L 280 680" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 2: Streaming & Ingestion -->
  <rect x="280" y="130" width="160" height="630" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="280" y="130" width="160" height="42" rx="12" fill="#334155"/>
  <text x="295" y="157" fill="#f8fafc" font-size="14" font-weight="700">2. Ingestion &amp; CDC</text>

  <g transform="translate(295, 200)">
    <rect width="130" height="150" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="12" y="24" fill="#f43f5e" font-size="12" font-weight="700">Kafka Topics</text>
    <text x="12" y="44" fill="#cbd5e1" font-size="10">• raw.telephony</text>
    <text x="12" y="62" fill="#cbd5e1" font-size="10">• raw.payments</text>
    <text x="12" y="80" fill="#cbd5e1" font-size="10">• raw.whatsapp</text>
    <text x="12" y="98" fill="#cbd5e1" font-size="10">• raw.field_visits</text>
    <text x="12" y="125" fill="#a855f7" font-size="10" font-weight="600">Schema Registry</text>
    <text x="12" y="140" fill="#94a3b8" font-size="9">Protobuf Contracts</text>
  </g>

  <g transform="translate(295, 380)">
    <rect width="130" height="160" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="12" y="24" fill="#10b981" font-size="12" font-weight="700">Data Contracts</text>
    <text x="12" y="44" fill="#94a3b8" font-size="10">Gatekeeper Checks:</text>
    <text x="12" y="64" fill="#cbd5e1" font-size="9">✓ Nullability Rules</text>
    <text x="12" y="82" fill="#cbd5e1" font-size="9">✓ Regex ID Formats</text>
    <text x="12" y="100" fill="#cbd5e1" font-size="9">✓ UTC Timestamps</text>
    <text x="12" y="118" fill="#cbd5e1" font-size="9">✓ Idempotency Key</text>
    <text x="12" y="145" fill="#f43f5e" font-size="9" font-weight="600">Dead Letter Queue</text>
  </g>

  <g transform="translate(295, 570)">
