    <text x="22" y="142" fill="#fef9c3" font-size="9">Verified Cash Ledger</text>

    <rect x="180" y="108" width="145" height="48" rx="4" fill="#422006" stroke="#ca8a04"/>
    <text x="187" y="126" fill="#fef08a" font-size="10" font-weight="700">Fact_Interactions (220k)</text>
    <text x="187" y="142" fill="#fef9c3" font-size="9">Voice, WhatsApp, SMS, Field</text>

    <rect x="15" y="164" width="310" height="58" rx="4" fill="#713f12" stroke="#eab308"/>
    <text x="22" y="182" fill="#fef08a" font-size="11" font-weight="700">Bridge_Payment_Attribution (Multi-Window Engine)</text>
    <text x="22" y="198" fill="#fef9c3" font-size="9">Attribution Lags: 0-24h, 24-72h, 3-7d (Operational) vs &gt;7d (Organic)</text>
    <text x="22" y="212" fill="#fef9c3" font-size="9">Separates ₹1.05 Bn true organic self-cure from ₹265 M touched recovery</text>
  </g>

  <!-- Connectors to Serving Layer -->
