    <text x="12" y="24" fill="#38bdf8" font-size="12" font-weight="700">Airflow / Prefect</text>
    <text x="12" y="44" fill="#94a3b8" font-size="10">Orchestration DAGs:</text>
    <text x="12" y="64" fill="#cbd5e1" font-size="9">• Hourly Micro-batch</text>
    <text x="12" y="82" fill="#cbd5e1" font-size="9">• Nightly Reconcile</text>
    <text x="12" y="100" fill="#cbd5e1" font-size="9">• 72h Watermark</text>
    <text x="12" y="125" fill="#fbbf24" font-size="10" font-weight="600">Late Ingestion</text>
  </g>

  <!-- Connectors to Lakehouse -->
  <path d="M 440 275 L 480 275" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 440 460 L 480 460" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 440 645 L 480 645" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 3: Lakehouse Medallion Architecture -->
  <rect x="480" y="130" width="370" height="630" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="480" y="130" width="370" height="42" rx="12" fill="#334155"/>
  <text x="495" y="157" fill="#f8fafc" font-size="14" font-weight="700">3. Medallion Analytical Warehouse (DuckDB / Delta)</text>

