    <text x="15" y="62" fill="#ffedd5" font-size="10">• stg_borrowers (30.6k) • stg_accounts (30k) • stg_payments (25.5k)</text>
    <text x="15" y="80" fill="#ffedd5" font-size="10">• stg_calls (91.3k) • stg_whatsapp (60.6k) • stg_dispositions (35k)</text>
    <text x="15" y="98" fill="#fde047" font-size="10" font-weight="600">Append-only audit trail | Full disaster replayability</text>
  </g>

  <!-- Down arrow Bronze to Silver -->
  <path d="M 665 300 L 665 325" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Silver Box -->
  <g transform="translate(495, 325)">
    <rect width="340" height="150" rx="8" fill="url(#boxSilver)" stroke="#475569"/>
    <text x="15" y="22" fill="#93c5fd" font-size="13" font-weight="700">SILVER LAYER (Cleaned &amp; Resolved)</text>
    <text x="15" y="42" fill="#e2e8f0" font-size="11">Entity resolution, deduplication, and sanity guards</text>
    <text x="15" y="62" fill="#cbd5e1" font-size="10">✓ Deduplicate Borrowers: SCD-2 window ranking (11k master)</text>
    <text x="15" y="78" fill="#cbd5e1" font-size="10">✓ Deduplicate Payments: Purge retries &amp; isolate SUCCESS (17.5k)</text>
    <text x="15" y="94" fill="#cbd5e1" font-size="10">✓ Normalize Telephony: 0s duration on un-answered calls</text>
    <text x="15" y="110" fill="#cbd5e1" font-size="10">✓ Flag Gateways: Inactive routing &amp; non-compliant hours</text>
    <text x="15" y="132" fill="#38bdf8" font-size="10" font-weight="600">dbt tests: Unique PKs | FK Integrity | Zero Data Explosions</text>
  </g>

  <!-- Down arrow Silver to Gold -->
  <path d="M 665 475 L 665 500" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gold Box -->
  <g transform="translate(495, 500)">
    <rect width="340" height="235" rx="8" fill="url(#boxGold)" stroke="#eab308"/>
    <text x="15" y="22" fill="#fef08a" font-size="13" font-weight="700">GOLD LAYER (Certified Business Models)</text>
    <text x="15" y="42" fill="#fef9c3" font-size="11">Conformed Star Schema &amp; Omnichannel Datamarts</text>
    
    <rect x="15" y="52" width="145" height="48" rx="4" fill="#422006" stroke="#ca8a04"/>
    <text x="22" y="70" fill="#fef08a" font-size="10" font-weight="700">Dim_Accounts (30k)</text>
    <text x="22" y="86" fill="#fef9c3" font-size="9">DPD, Risk, Balance, Orphan</text>

    <rect x="180" y="52" width="145" height="48" rx="4" fill="#422006" stroke="#ca8a04"/>
