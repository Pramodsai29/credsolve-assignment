    <text x="15" y="44" fill="#bfdbfe" font-size="10">Single Source of Truth Formulas:</text>
    <text x="15" y="62" fill="#dbeafe" font-size="9">• Daily Run Rate = Success Amt / Days</text>
    <text x="15" y="78" fill="#dbeafe" font-size="9">• Contact Rate = Reach / Total Dialed</text>
    <text x="15" y="94" fill="#dbeafe" font-size="9">• PTP Kept Rate = Ledger Matched / PTPs</text>
    <text x="15" y="110" fill="#60a5fa" font-size="9" font-weight="600">Zero Spreadsheet Discrepancies</text>
  </g>

